# Settings for Pages CMS (https://pagescms.org), the phone-friendly editor.
# Routes are sorted in folders: Routes / <Gym> / <Wall> / <route>.
media:
  input: images
  output: /images

content:
  - name: routes
    label: Routes
    type: collection
    path: _routes
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{hour}{minute}{second}.md"
    subfolders: true
    view:
      foldersFirst: true
      fields: [grade, colors, date]
      default:
        sort: date
        order: desc
    fields:
      - name: grade
        label: Grade
        type: string
        required: true
        description: Any grading style, e.g. 6A, V4 or "Yellow circuit 3".
      - name: colors
        label: Hold color(s)
        type: select
        description: Pick one, or two for a dual-color route.
        options:
          multiple: true
          max: 2
          values: [Red, Orange, Yellow, Green, Mint, Turquoise, Blue, Purple, Pink, Black, White, Grey, Brown, Beige]
      - name: custom_color
        label: Other color
        type: string
        description: Only if the color isn't in the list. A hex code like #ff8800, or two like #ff8800/#222222.
      - name: image
        label: Photo
        type: image
        options:
          path: images/routes
      - name: date
        label: Date
        type: date
      - name: notes
        label: Notes
        type: text
